<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Glowing Debasish Moyra Animation</title>
  <style>
    body {
      margin: 0;
      background-color: #050515; /* আরও গাঢ় ব্যাকগ্রাউন্ড যাতে আলো স্পষ্ট বোঝা যায় */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #name-container {
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
      z-index: 10;
      display: flex;
      letter-spacing: 2px;
    }

    /* আলোর কিরণসহ অক্ষরের স্টাইল */
    .char {
      display: inline-block;
      opacity: 0;
      transform: scale(0.3) translateY(30px);
      /* আলোর দ্যুতির জন্য টেক্সট শ্যাডো এবং ড্রপ শ্যাডো */
      animation: glowIn .0s ease-out forwards;
    }

    /* আলোর ঝলক ও অক্ষর ভেসে ওঠার অ্যানিমেশন */
    @keyframes glowIn {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(30px);
        text-shadow: 0 0 0px #fff;
      }
      50% {
        opacity: 1;
        transform: scale(1.3) translateY(-5px);
        /* তীব্র আলোর কিরণ (Glow Rays) */
        text-shadow: 
          0 0 10px #00ffff,
          0 0 20px #00ffff,
          0 0 40px #00ffff,
          0 0 80px #00ffff,
          0 0 120px #00ffff;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        /* স্থায়ী হালকা লাইট ইফেক্ট */
        text-shadow: 
          0 0 5px #00ffff,
          0 0 15px #00ffff,
          0 0 30px #00ffff;
      }
    }

    /* ফুলের পাঁপড়ির স্টাইল */
    .petal {
      position: absolute;
      top: -20px;
      width: 15px;
      height: 15px;
      background-color: #ff69b4;
      border-radius: 50% 0 50% 50%;
      opacity: 0.7;
      animation: fall linear infinite;
      box-shadow: 0 0 8px #ff69b4; /* পাঁপড়িতেও হালকা গ্লো */
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="name-container"></div>

  <script>
    const fullName = "DEBASISH MOYRA";
    const container = document.getElementById('name-container');
    let index = 0;

    // অক্ষর টাইপ করার সাথে আলোর ঝিলিক দেওয়া
    function typeName() {
      if (index < fullName.length) {
        const span = document.createElement('span');
        span.className = 'char';
        
        // স্পেস বা ফাঁকা জায়গা ঠিক রাখা
        span.innerHTML = fullName[index] === " " ? "&nbsp;&nbsp;" : fullName[index];
        
        container.appendChild(span);
        index++;
        
        // ঠিক ১ সেকেন্ড (১০-০০ মিলি-সেকেন্ড) পর পর পরের অক্ষর আসবে
        setTimeout(typeName, 1000); 
      }
    }

    // পাঁপড়ি তৈরির ফাংশন
    function createPetals() {
      for (let i = 0; i < 20; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
        petal.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(petal);
      }
    }

    // স্ক্রিপ্ট স্টার্ট
    typeName();
    createPetals();
  </script>
</body>
</html>
