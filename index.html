<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন Subho Kayal | মামা Debasish Moyra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tiro+Bangla&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            font-family: 'Poppins', 'Tiro Bangla', sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* --- ইন্টারফেস ১: কেক ও টেবিল ফ্যান --- */
        #screen-one {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
            background: radial-gradient(circle at center, #1e293b, #090d16);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            z-index: 10;
        }

        #screen-one.hide-away {
            opacity: 0;
            transform: scale(0.9) translateY(40px);
            pointer-events: none;
        }

        .intro-title {
            position: absolute;
            top: 40px;
            text-align: center;
        }

        .intro-title h2 {
            font-size: 2.2rem;
            color: #facc15;
            text-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
        }

        .intro-title p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-top: 5px;
        }

        .stage-box {
            position: relative;
            width: 820px;
            height: 440px;
            display: flex;
            justify-content: center;
        }

        .wooden-table {
            position: absolute;
            bottom: 0;
            width: 780px;
            height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .table-slab {
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, #b45309, #78350f);
            border-radius: 12px 12px 6px 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 5;
        }

        .table-skirt {
            width: 95%;
            height: 15px;
            background: #92400e;
            z-index: 4;
        }

        .table-pillars {
            width: 90%;
            height: 125px;
            display: flex;
            justify-content: space-between;
        }

        .pillar {
            width: 32px;
            height: 100%;
            background: linear-gradient(90deg, #78350f, #92400e, #451a03);
            border-radius: 0 0 8px 8px;
        }

        .table-items {
            position: absolute;
            bottom: 170px;
            width: 740px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 50px;
            z-index: 10;
        }

        /* ফ্যান */
        .fan-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .fan-net {
            width: 150px;
            height: 150px;
            background: #1e293b;
            border: 6px solid #38bdf8;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .blades-holder {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blade-shape {
            position: absolute;
            width: 28px;
            height: 56px;
            background: #f43f5e;
            border-radius: 50% 50% 15% 15%;
        }
        .b-pos1 { transform: rotate(0deg) translateY(-25px); }
        .b-pos2 { transform: rotate(120deg) translateY(-25px); }
        .b-pos3 { transform: rotate(240deg) translateY(-25px); }

        .spin-fast {
            animation: bladeRotate 0.08s linear infinite;
        }

        @keyframes bladeRotate {
            100% { transform: rotate(360deg); }
        }

        .fan-cap {
            width: 32px;
            height: 32px;
            background: #cbd5e1;
            border: 3px solid #0f172a;
            border-radius: 50%;
            z-index: 5;
        }

        .fan-stem {
            width: 16px;
            height: 65px;
            background: linear-gradient(90deg, #64748b, #94a3b8, #475569);
        }

        .fan-foot {
            width: 120px;
            height: 28px;
            background: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 15px 15px 5px 5px;
        }

        .air-wave {
            position: absolute;
            left: 170px;
            top: 40px;
            width: 0;
            height: 60px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), transparent);
            filter: blur(4px);
            border-radius: 30px;
            opacity: 0;
            transition: width 0.4s ease-out, opacity 0.3s;
            pointer-events: none;
            z-index: 15;
        }

        .air-wave.active {
            width: 300px;
            opacity: 0.9;
        }

        /* কেক */
        .cake-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .candle-tube {
            position: relative;
            width: 14px;
            height: 48px;
            background: repeating-linear-gradient(45deg, #facc15, #facc15 6px, #ef4444 6px, #ef4444 12px);
            border-radius: 3px;
            z-index: 15;
        }

        .candle-fire {
            position: absolute;
            top: -26px;
            left: -3px;
            width: 20px;
            height: 28px;
            background: radial-gradient(ellipse at bottom, #fff, #fbbf24 40%, #ea580c 90%);
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 0 20px #f59e0b, 0 0 35px #dc2626;
            animation: flameBob 0.15s infinite alternate;
            transform-origin: bottom center;
            transition: all 0.35s ease-out;
            z-index: 20;
        }

        @keyframes flameBob {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.08) rotate(3deg); }
        }

        .candle-fire.extinguished {
            animation: none;
            transform: rotate(50deg) translate(20px, 5px) scale(0);
            opacity: 0;
        }

        .smoke-puff {
            position: absolute;
            top: -20px;
            left: 2px;
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border-radius: 50%;
            opacity: 0;
        }

        .smoke-puff.rise {
            animation: smokeRise 1.2s forwards ease-out;
        }

        @keyframes smokeRise {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: translate(60px, -40px) scale(3.5); filter: blur(3px); }
        }

        .c-step1 {
            width: 110px;
            height: 42px;
            background: #f43f5e;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2);
            z-index: 12;
        }
        .c-step2 {
            width: 160px;
            height: 50px;
            background: #fbbf24;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 -8px 0 #d97706;
            z-index: 11;
        }
        .c-step3 {
            width: 215px;
            height: 60px;
            background: #3b82f6;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -10px 0 #1d4ed8;
            z-index: 10;
        }

        .cake-tag {
            font-size: 0.95rem;
            color: #fff;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 3px 12px;
            border-radius: 10px;
        }

        .c-dish {
            width: 250px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 9;
        }

        .control-box {
            margin-top: 25px;
            z-index: 20;
        }

        .trigger-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .trigger-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #047857;
        }


        /* --- ইন্টারফেস ২: ফটো গ্যালারি ও সেলিব্রেশন --- */
        #screen-two {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e1b4b, #020617);
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            z-index: 20;
            padding: 20px;
        }

        #screen-two.show-celebration {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        .greet-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .greet-header h1 {
            font-size: 2.8rem;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
            letter-spacing: 1px;
        }

        .subho-highlight {
            color: #38bdf8;
            font-size: 3.3rem;
            font-weight: 800;
        }

        .debasish-mama-badge {
            display: inline-block;
            margin-top: 10px;
            background: rgba(244, 114, 182, 0.15);
            border: 2px solid #f472b6;
            padding: 8px 25px;
            border-radius: 30px;
            color: #fbcfe8;
            font-size: 1.3rem;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
        }

        .debasish-mama-badge b {
            color: #facc15;
        }

        /* পোলারয়েড ফটো গ্যালারি */
        .photo-gallery {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1000px;
            z-index: 25;
        }

        .polaroid-card {
            background: #fff;
            padding: 12px 12px 18px 12px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transform: rotate(var(--rot));
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 220px;
            text-align: center;
        }

        .polaroid-card:hover {
            transform: scale(1.1) rotate(0deg);
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            z-index: 30;
        }

        .polaroid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            background: #334155;
            display: block;
        }

        .polaroid-caption {
            margin-top: 10px;
            font-size: 1rem;
            color: #1e293b;
            font-weight: 600;
        }

        /* বাজি ও বোম বিস্ফোরণ ক্যানভাস */
        #fireworksLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
    </style>
</head>
<body>

    <canvas id="fireworksLayer"></canvas>

    <!-- ইন্টারফেস ১: কেক ও ফ্যান -->
    <div id="screen-one">
        <div class="intro-title">
            <h2>শুভ জন্মদিন Subho Kayal!</h2>
            <p>সুইচটি টিপে ফ্যান অন করুন 💨</p>
        </div>

        <div class="stage-box">
            <div class="table-items">
                <!-- টেবিল ফ্যান -->
                <div class="fan-unit">
                    <div class="fan-net">
                        <div class="blades-holder" id="fanBlades">
                            <div class="blade-shape b-pos1"></div>
                            <div class="blade-shape b-pos2"></div>
                            <div class="blade-shape b-pos3"></div>
                        </div>
                        <div class="fan-cap"></div>
                    </div>
                    <div class="fan-stem"></div>
                    <div class="fan-foot"></div>
                    <div class="air-wave" id="airStream"></div>
                </div>

                <!-- কেক ও মোমবাতি -->
                <div class="cake-block">
                    <div class="candle-tube">
                        <div class="candle-fire" id="candleFlame"></div>
                        <div class="smoke-puff" id="smokePuff"></div>
                    </div>
                    <div class="c-step1"></div>
                    <div class="c-step2"></div>
                    <div class="c-step3">
                        <div class="cake-tag">Subho Kayal</div>
                    </div>
                    <div class="c-dish"></div>
                </div>
            </div>

            <!-- কাঠের টেবিল -->
            <div class="wooden-table">
                <div class="table-slab"></div>
                <div class="table-skirt"></div>
                <div class="table-pillars">
                    <div class="pillar"></div>
                    <div class="pillar"></div>
                </div>
            </div>
        </div>

        <div class="control-box">
            <button class="trigger-btn" id="startBtn" onclick="runCelebrationSequence()">🌀 ফ্যান চালু করুন (ON)</button>
        </div>
    </div>

    <!-- ইন্টারফেস ২: ফটো গ্যালারি ও সেলিব্রেশন -->
    <div id="screen-two">
        <div class="greet-header">
            <h1>🎉 HAPPY BIRTHDAY <span class="subho-highlight">SUBHO</span>! 🎉</h1>
            <div class="debasish-mama-badge">
                স্নেহের শুভেচ্ছা ও আশীর্বাদে: <b>দেবাশীষ ময়রা (Subho-র মামা)</b> 💖
            </div>
        </div>

        <!-- আপনার ৩টি ছবি যুক্ত অংশ -->
        <div class="photo-gallery">
            <div class="polaroid-card" style="--rot: -4deg;">
                <img class="polaroid-img" src="Subho1.jpg" alt="Subho 1" onerror="this.src='https://placehold.co/300x300?text=Subho1.jpg+Missing'">
                <div class="polaroid-caption">শুভ মুহূর্ত 💖</div>
            </div>

            <div class="polaroid-card" style="--rot: 3deg;">
                <img class="polaroid-img" src="Subho2.jpg" alt="Subho 2" onerror="this.src='https://placehold.co/300x300?text=Subho2.jpg+Missing'">
                <div class="polaroid-caption">মামা ও ভাগ্নে 🌟</div>
            </div>

            <div class="polaroid-card" style="--rot: -2deg;">
                <img class="polaroid-img" src="Subho3.jpg" alt="Subho 3" onerror="this.src='https://placehold.co/300x300?text=Subho3.jpg+Missing'">
                <div class="polaroid-caption">স্মরণীয় দিন ✨</div>
            </div>
        </div>
    </div>

    <script>
        let hasTriggered = false;

        function runCelebrationSequence() {
            if (hasTriggered) return;
            hasTriggered = true;

            const startBtn = document.getElementById('startBtn');
            const fanBlades = document.getElementById('fanBlades');
            const airStream = document.getElementById('airStream');
            const candleFlame = document.getElementById('candleFlame');
            const smokePuff = document.getElementById('smokePuff');
            const screenOne = document.getElementById('screen-one');
            const screenTwo = document.getElementById('screen-two');

            startBtn.disabled = true;
            startBtn.innerText = "ফ্যান চলছে...";

            // ফ্যান চালু ও বাতাস
            fanBlades.classList.add('spin-fast');
            setTimeout(() => {
                airStream.classList.add('active');
            }, 250);

            // বাতাস লেগে মোমবাতি নিভে যাওয়া
            setTimeout(() => {
                candleFlame.classList.add('extinguished');
                smokePuff.classList.add('rise');
            }, 700);

            // দ্বিতীয় স্ক্রিনে ট্রানজিশন
            setTimeout(() => {
                screenOne.classList.add('hide-away');
                screenTwo.classList.add('show-celebration');

                triggerBombSound();
                launchGrandFireworks();
                playVoiceMessage();
            }, 1200);
        }

        // বোম ব্লাস্টের গভীর সাউন্ড ইফেক্ট (Web Audio API)
        function triggerBombSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();

                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const bufferSize = ctx.sampleRate * 1.5;
                        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                        const output = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            output[j] = (Math.random() * 2 - 1) * Math.exp(-j / (ctx.sampleRate * 0.35));
                        }

                        const noise = ctx.createBufferSource();
                        noise.buffer = buffer;

                        const filter = ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(350, ctx.currentTime);
                        filter.frequency.linearRampToValueAtTime(25, ctx.currentTime + 1.2);

                        const gain = ctx.createGain();
                        gain.gain.setValueAtTime(2.0, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.3);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(ctx.destination);

                        noise.start();
                    }, i * 320);
                }
            } catch (e) {
                console.log(e);
            }
        }

        // ভয়েসে শুভেচ্ছা বার্তা ঘোষণা
        function playVoiceMessage() {
            if ('speechSynthesis' in window) {
                const speechText = "Happy Birthday Subho Kayal! Your Debasish Moyra mama wishes you a very happy and joyful birthday!";
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.pitch = 1.1;
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // আতশবাজি ও বিস্ফোরণ অ্যানিমেশন (Canvas)
        const canvas = document.getElementById("fireworksLayer");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function updateCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', updateCanvasSize);
        updateCanvasSize();

        function createBlastExplosion(x, y) {
            const colors = ['#facc15', '#38bdf8', '#f43f5e', '#10b981', '#a855f7', '#fb923c', '#ffffff'];
            for (let i = 0; i < 85; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    radius: Math.random() * 3.5 + 1.5,
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.008
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.09;
                p.alpha -= p.decay;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(renderParticles);
        }

        function launchGrandFireworks() {
            renderParticles();

            let count = 0;
            const blastInterval = setInterval(() => {
                const rx = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                const ry = Math.random() * (canvas.height * 0.45) + 60;
                createBlastExplosion(rx, ry);
                count++;
                if (count > 12) clearInterval(blastInterval);
            }, 260);
        }
    </script>
</body>
    </html>
